name: Weekly Local Events Update

on:
  schedule:
    # Runs every Monday at 8:00 AM UTC (adjust timezone as needed)
    - cron: "0 8 * * 1"

  # Allows you to trigger the workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run events updater
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          LODGIFY_API_KEY:      ${{ secrets.LODGIFY_API_KEY }}
          LODGIFY_PAGE_ID:      ${{ secrets.LODGIFY_PAGE_ID }}
          PROPERTY_LOCATION:    ${{ vars.PROPERTY_LOCATION }}
          LODGIFY_WEBSITE_SLUG: ${{ vars.LODGIFY_WEBSITE_SLUG }}
        run: python update_events.py
